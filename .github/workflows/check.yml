name: Check training code

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Validate the notebook without cloud execution
        run: |
          python - <<'PY'
          import nbformat
          notebook = nbformat.read('notebooks/01_azure_ml_walkthrough.ipynb', as_version=4)
          nbformat.validate(notebook)
          PY
